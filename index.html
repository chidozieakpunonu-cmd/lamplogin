<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamp Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="lamp-wrap">
      <div class="lamp-hang">
        <div class="rod"></div>
        <div class="shade"></div>
        <div class="bulb-glow"></div>
      </div>
      <button class="cord-btn" id="pull" aria-label="Pull the cord to turn on the light">
        <span class="cord"></span>
        <span class="cord-tip"></span>
      </button>
      <span class="hint">pull the cord</span>
    </div>

    <form class="panel" id="loginForm">
      <h1>Welcome back</h1>
      <p>Sign in to keep going.</p>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="submit" type="submit">Sign in</button>
    </form>
  </div>

<script src="script.js"></script>
</body>
</html>
